<script>/* 首帧应用主题，避免深色模式刷新时白屏闪烁 */(function(){try{var t=localStorage.getItem("enzo_theme");if(t==="dark"){var d=document.documentElement;d.setAttribute("data-theme","dark");d.style.colorScheme="dark";}}catch(e){}})();</script>

<body class="home-min">
<div id="siteHeader"></div>

<main class="hm-wrap">
  <!-- ===== 品牌 + 搜索：一屏内的视觉重心 ===== -->
  <section class="hm-stage">
    <div class="hm-brand">
      <img class="hm-logo" src="assets/logo.jpg" alt="恩卓智选">
      <h1>恩卓智选</h1>
      <p class="hm-sub">选择比努力更重要 · 以就业视角倒推志愿</p>
    </div>

    <div class="hm-search">
      <div class="hm-input">
        <span class="hm-ico" aria-hidden="true">🔍</span>
        <input id="hsInput" type="search" enterkeyhint="search" autocomplete="off"
               placeholder="搜专业、高校或省份，如：精神医学、清华大学、浙江">
        <button type="button" class="hm-clear" id="hsClear" aria-label="清空">✕</button>
      </div>
      <button type="button" class="btn btn-brand hm-go" id="hsBtn">搜索</button>
    </div>

    <div class="hm-tags" id="quickTags">
      <span class="hm-tags-lb">大家都在搜</span>
    </div>
  </section>
</main>

<!-- ===== 搜索结果浮层：覆盖显示，不撑高页面 ===== -->
<div class="hm-overlay" id="hsOverlay">
  <div class="hm-overlay-panel" role="dialog" aria-modal="true" aria-label="搜索结果">
    <div class="hm-overlay-head">
      <div class="hm-overlay-tt">
        <b>搜索结果</b>
        <span class="hm-overlay-kw" id="hsKw"></span>
      </div>
      <button type="button" class="hm-overlay-x" id="hsClose" aria-label="关闭搜索结果">✕</button>
    </div>
    <div class="hm-overlay-body" id="hsResults"></div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="assets/js/data-provinces.js"></script>
<script src="assets/js/data-majors.js"></script>
<script src="assets/js/data-majors-catalog.js"></script>
<script src="assets/js/data-majors-merge.js"></script>
<script src="assets/js/data-colleges.js"></script>
<script src="assets/js/data-colleges-all.js"></script>
<script src="assets/js/kb.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/assistant.js"></script>
<script>
/* 首页用精简页脚，保证「一屏不滚动」 */
buildShell("home", { compactFooter: true });

/* ===== 全局搜索：结果在浮层里展示，不改变文档高度 ===== */
(function () {
  const input = document.getElementById("hsInput");
  const btn = document.getElementById("hsBtn");
  const clearBtn = document.getElementById("hsClear");
  const ov = document.getElementById("hsOverlay");
  const panel = ov ? ov.querySelector(".hm-overlay-panel") : null;
  const res = document.getElementById("hsResults");
  const kw = document.getElementById("hsKw");
  if (!input || !btn || !ov) return;

  function syncClear() {
    clearBtn.style.display = input.value.trim() ? "grid" : "none";
  }
  function openOverlay() {
    ov.classList.add("open");
    document.body.classList.add("hm-lock");
    if (panel) panel.focus();
  }
  function closeOverlay() {
    ov.classList.remove("open");
    document.body.classList.remove("hm-lock");
  }

  function card(m, type) {
    if (type === "major") {
      return `<a class="hs-card" href="majors.html?q=${encodeURIComponent(m.name)}">
        <div class="hs-card-h"><b>${esc(m.name)}</b><span class="chip gray">专业</span></div>
        <div class="hs-card-m">${esc(m.code || "")} · ${esc(m.cat)} / ${esc(m.sub || "—")} · 学制 ${m.years} 年</div>
        <div class="hs-card-d">${esc((m.intro || "").slice(0, 58))}${(m.intro || "").length > 58 ? "…" : ""}</div>
      </a>`;
    }
    const tags = (m.tags && m.tags.length) ? m.tags : (m.cat ? [m.cat] : []);
    const TAG_CLS = { "C9": "purple", "985": "purple", "211": "gold", "双一流": "green" };
    const chips = tags.slice(0, 3).map(t =>
      `<span class="chip ${TAG_CLS[t] || "gray"}">${esc(t)}</span>`).join("") ||
      `<span class="chip gray">${esc(m.level || "院校")}</span>`;
    const sub = m.code
      ? `${esc(m.city)} · 标识码 ${esc(m.code)}`
      : `${esc(m.prov)} · ${esc(m.city)} · 军队院校`;
    const desc = (m.elite && m.elite.note) || m.note || "";
    return `<a class="hs-card" href="college.html?name=${encodeURIComponent(m.name)}">
      <div class="hs-card-h"><b>${esc(m.name)}</b>${chips}</div>
      <div class="hs-card-m">${sub}</div>
      ${desc ? `<div class="hs-card-d">${esc(desc)}</div>` : ""}
    </a>`;
  }

  function run() {
    const q = input.value.trim();
    input.blur();
    if (!q) { input.focus(); return; }

    const majors = (window.MAJORS || []).filter(m =>
      m.name.includes(q) || (m.sub || "").includes(q) || (m.cat || "").includes(q) ||
      (m.code || "").includes(q) || (m.tags || []).some(t => t.includes(q))
    ).slice(0, 6);

    const colleges = (window.COLLEGES_ALL || window.COLLEGES || []).filter(c =>
      c.name.includes(q) || (c.code || "").includes(q) || (c.city || "").includes(q) ||
      (c.dept || "").includes(q) || c.prov === q ||
      (c.elite && (c.elite.tags || []).some(t => t.includes(q)))
    ).slice(0, 6);

    kw.textContent = "“" + q + "”";

    if (!majors.length && !colleges.length) {
      res.innerHTML = `<div class="hs-empty">没有找到「${esc(q)}」相关的专业或高校。<br>
        <span class="muted small">换个说法试试，或直接去
        <a href="majors.html?q=${encodeURIComponent(q)}">专业百科</a>、
        <a href="colleges.html?q=${encodeURIComponent(q)}">高校名单</a> 看看。</span></div>`;
      openOverlay();
      return;
    }

    res.innerHTML =
      (majors.length ? `<div class="hs-group">📚 专业（${majors.length}）</div>` +
        majors.map(m => card(m, "major")).join("") : "") +
      (colleges.length ? `<div class="hs-group">🏛️ 高校（${colleges.length}）</div>` +
        colleges.map(c => card(c, "college")).join("") : "") +
      `<div class="hs-more">
         <a href="majors.html?q=${encodeURIComponent(q)}">在专业百科中查看全部 →</a>
         <a href="colleges.html?q=${encodeURIComponent(q)}">在高校名单中查看全部 →</a>
       </div>`;
    openOverlay();
  }

  btn.addEventListener("click", run);
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); run(); } });
  input.addEventListener("input", syncClear);
  clearBtn.addEventListener("click", () => {
    input.value = ""; syncClear(); input.focus();
  });
  document.getElementById("hsClose").addEventListener("click", closeOverlay);
  ov.addEventListener("click", e => { if (e.target === ov) closeOverlay(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlay(); });

  /* 快捷标签：点一下直接出结果 */
  document.querySelectorAll("#quickTags button").forEach(b => {
    b.addEventListener("click", () => {
      input.value = b.dataset.q;
      syncClear();
      run();
    });
  });

  syncClear();
})();

/* ===== 大家都在搜：每次进入随机换一批，桌面端定时轮换 ===== */
(function () {
  const box = document.getElementById("quickTags");
  const input = document.getElementById("hsInput");
  const btn = document.getElementById("hsBtn");
  if (!box || !input || !btn) return;

  /* 词池按「专业 / 高校 / 省份」分三组；都用短词，避免标签换行把一屏顶出滚动条 */
  const POOL = {
    major: ["计算机", "人工智能", "临床医学", "电气工程", "软件工程", "口腔医学", "法学",
            "金融学", "会计学", "电子信息", "自动化", "数学", "物理学", "药学", "护理学",
            "建筑学", "新闻学", "心理学", "经济学", "微电子", "大数据", "机器人工程",
            "精神医学", "中医学", "统计学", "化学", "车辆工程", "通信工程", "生物科学", "土木工程"],
    college: ["清华大学", "北京大学", "复旦大学", "浙江大学", "上海交通大学", "南京大学",
              "中山大学", "四川大学", "武汉大学", "同济大学", "华中科技大学", "西安交通大学"],
    prov: ["浙江", "广东", "江苏", "山东", "河南", "四川", "北京", "上海", "湖北", "湖南"],
  };

  function pick(arr, n) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a.slice(0, n);
  }

  /* 3 专业 + 2 高校 + 1 省份，再打散顺序：每次组合都不同，但不至于全是一类 */
  function compose() {
    return [...pick(POOL.major, 3), ...pick(POOL.college, 2), ...pick(POOL.prov, 1)]
      .sort(() => Math.random() - 0.5);
  }

  let last = "";
  function render(list, animate) {
    const apply = () => {
      box.querySelectorAll("button").forEach(b => b.remove());
      list.forEach(q => {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.q = q;
        b.textContent = q;
        b.addEventListener("click", () => { input.value = q; btn.click(); });
        box.appendChild(b);
      });
      box.classList.remove("is-fading");
    };
    if (!animate) { apply(); return; }
    box.classList.add("is-fading");
    setTimeout(apply, 170);
  }

  function refresh(animate) {
    /* 重掷几次，避免连着两次出现同一组 */
    let list = compose();
    for (let i = 0; i < 6 && list.join("|") === last; i++) list = compose();
    last = list.join("|");
    render(list, animate);
  }

  refresh(false);

  /* 只在「够宽 + 够高」的桌面端自动轮换；手机/矮屏只保证每次进入不同 */
  const canRotate = window.matchMedia("(min-width: 900px) and (min-height: 700px)").matches
    && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (canRotate) {
    setInterval(() => { if (!document.hidden) refresh(true); }, 9000);
  }
})();
</script>
</body>
</html>
