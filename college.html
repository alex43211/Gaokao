<script>
buildShell("college");

/* 院校名 -> 教育部学信网「阳光高考」院校库检索（官方权威入口） */
function chsiUrl(name) {
  return "https://gaokao.chsi.com.cn/sch/search.do?searchType=1&yxmc=" + encodeURIComponent(name);
}
function baiduUrl(name) {
  return "https://www.baidu.com/s?wd=" + encodeURIComponent(name + " 官网 招生章程");
}
/* 归一化校名，兼容半角/全角括号 */
function normName(s) {
  return String(s || "").replace(/（/g, "(").replace(/）/g, ")").replace(/\s/g, "");
}

/* 校徽 HTML：命中字体图标库则渲染校徽，否则回落到「首字」占位
   —— 校名 -> Unicode 的映射逐条核验自 china_school_badge 的注释标注，
      绝不做「按顺序猜」的匹配，避免弄错学校。 */
function badgeHtml(name) {
  const B = window.COLLEGE_BADGES || {};
  const n = normName(name);
  let uni = B[name];
  if (!uni) {                                   // 容错：忽略括号/全半角差异再找
    for (const k in B) {
      if (normName(k) === n) { uni = B[k]; break; }
    }
  }
  if (uni) {
    // 用 <i> 承载 Unicode 码点，配合 badge.css 的字体族渲染
    return `<div class="badge-hero" title="${esc(name)} 校徽">
        <i class="fc-badge" aria-hidden="true">&#x${uni};</i>
        <span class="sr-only">${esc(name)}校徽</span>
      </div>`;
  }
  const ch = (name || "校").trim().charAt(0) || "校";
  return `<div class="badge-fallback" title="${esc(name)}（未收录校徽，以校名首字占位）">${esc(ch)}</div>`;
}

(function () {
  const main = document.getElementById("colMain");
  const name = decodeURIComponent(window.qs("name"));
  const C = window.COLLEGES || [];             // 116 所精英院校（含点评/标签/参考分）
  const ALL = window.COLLEGES_ALL || [];       // 教育部 2952 所完整名单

  /* 先在完整名单里找（覆盖所有正规院校），再回落到精英库 */
  const all = ALL.find(c => normName(c.name) === normName(name));
  const col = C.find(c => normName(c.name) === normName(name)) || (all && all.elite
    ? Object.assign({}, all.elite, {
        name: all.name, prov: all.prov, city: all.city,
        level: all.cat, tags: all.tags,
      })
    : null);

  if (!all && !col) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="big">🏛️</div>
        <p>没有找到「<b>${esc(name)}</b>」这所院校。</p>
        <p class="muted small mt-10">本站院校库照录教育部《全国高等学校名单》全部 <b>2952 所</b>普通高校
        （本科 1412 所 + 高职专科 1540 所）。<br>如果这里查不到，可能是：① 名称有出入（试试简称或去掉括号里的校区名）；
        ② 属于成人高校（244 所，不在本名单内）；③ 港澳台地区高校（本名单未包含）。</p>
        <div class="mt-24">
          <a class="btn btn-brand" href="colleges.html">← 去全国高校名单搜索</a>
          <a class="btn btn-ghost" href="map.html">看全国高校地图</a>
        </div>
      </div>`;
    return;
  }

  /* —— 展示用的合并字段：优先官方名单，补充精英库点评 —— */
  const dName  = all ? all.name  : col.name;
  const dProv  = (all && all.prov) || col.prov || "";
  const dCity  = (all && all.city) || col.city || "";
  const dLevel = (all && all.cat) || col.level || "";
  const dType  = (col && col.type) || "—";
  const dCode  = all ? all.code : "";
  const dDept  = all ? all.dept : "";
  const dLen   = all ? all.level : "";        // 本科 / 专科
  const dRemark= all ? all.remark : "";

  document.title = dName + " · 院校详情 | 恩卓智选";
  document.getElementById("crumbName").textContent = dName;
  document.getElementById("colTitle").textContent = "🏛️ " + dName;
  document.getElementById("colSub").textContent =
    `${dProv} · ${dCity}` + (dLevel ? ` · ${dLevel}` : "") + (all ? ` · ${dLen}` : "");

  const prov = (window.PROVINCES || {})[dProv];
  const lvMap = { "985": "purple", "211": "gold", "双一流": "green", "普通本": "gray", "专科": "gray" };

  /* 多标签：优先取数据层 tags（可多值），回落单值分类 */
  const allTags = (all && (all.tags || []).length) ? all.tags
    : (all && all.cat ? [all.cat] : []);
  const dCat = dLevel || (all && all.cat) || "";
  const TAG_CLS = { "C9": "purple", "985": "purple", "211": "gold", "双一流": "green" };
  const tagCls = t => TAG_CLS[t] || "gray";

  /* 同省院校：优先取官方名单里的同省院校 */
  const sameProvPool = all ? ALL.filter(c => c.prov === dProv && c.name !== dName) : C.filter(c => c.prov === dProv && c.name !== dName);
  const sameProv = sameProvPool.slice(0, 40);
  const sameProvTotal = sameProvPool.length;

  const hasElite = col && col.note;

  main.innerHTML = `
    <div class="report-grid report-grid--college">
      <div>
        <div class="report-card" style="margin:0 0 18px;">
          <div class="badge-title-row">
            ${badgeHtml(dName)}
            <div style="flex:1;min-width:0;">
              <div class="flex between items-center wrap gap-10">
                <div>
                  <h2 style="margin:0;font-size:22px;">${esc(dName)}</h2>
                  <div class="muted small mt-8">
                    ${esc(dCity)}${dProv ? "（" + esc(dProv) + "）" : ""}
                    ${dCode ? " ｜ 学校标识码 " + esc(dCode) : ""}
                  </div>
                </div>
                <div class="flex wrap gap-6">
                  ${(allTags.length ? allTags : [dCat]).map(t =>
                    `<span class="chip ${tagCls(t)}" style="font-size:13px;padding:6px 14px;font-weight:600;">${esc(t)}</span>`
                  ).join("")}
                </div>
              </div>
            </div>
          </div>

          <!-- 院校层次标签（可多值） -->
          ${allTags.length ? `
          <div class="mt-16" style="padding:14px 16px;background:#f5fff9;border:1px solid #cfeee0;border-radius:12px;">
            <b class="small">🏅 院校层次</b>
            <div class="mt-10 flex wrap gap-10">
              ${allTags.map(t => {
                const desc = { "C9": "九校联盟", "985": "985 工程", "211": "211 工程", "双一流": "双一流建设高校" }[t] || "";
                return `<span class="chip ${tagCls(t)}" style="font-size:13px;padding:6px 14px;font-weight:600;">${esc(t)}${desc ? " · " + desc : ""}</span>`;
              }).join("")}
            </div>
            <p class="muted small mt-10" style="margin-bottom:0;line-height:1.9;">
              ${allTags.includes("985")
                ? "该校为 <b>985 工程</b> 高校，同时必然具备 211 与双一流身份；985 / 211 名单已固定，不再新增。"
                : allTags.includes("211")
                  ? "该校为 <b>211 工程</b> 高校，同时具备双一流身份；211 名单已固定，不再新增。"
                  : "该校为 <b>双一流</b> 建设高校（第二轮 · 2022 年）。双一流名单动态调整，以教育部最新公布为准。"}
            </p>
          </div>` : ""}

          <!-- 官方登记信息（照录教育部名单，可核验） -->
          ${all ? `
          <div class="mt-16" style="padding:14px 16px;background:#f7f9ff;border:1px solid #e2e9fb;border-radius:12px;">
            <b class="small">📋 ${all.src === "army" ? "军队院校信息" : "教育部官方登记信息"}</b>
            <div class="grid g2 mt-10" style="gap:8px 20px;">
              <div class="stat-mini"><span>学校名称</span><span class="v">${esc(all.name)}</span></div>
              <div class="stat-mini"><span>学校标识码</span><span class="v" style="font-family:ui-monospace,Menlo,Consolas,monospace;">${esc(all.code || "—")}</span></div>
              <div class="stat-mini"><span>主管部门</span><span class="v">${esc(all.dept)}</span></div>
              <div class="stat-mini"><span>所在地</span><span class="v">${esc(all.city)}</span></div>
              <div class="stat-mini"><span>办学层次</span><span class="v">${esc(all.level)}</span></div>
              <div class="stat-mini"><span>办学性质</span><span class="v">${esc(all.remark || "公办")}</span></div>
            </div>
            <p class="muted small mt-10" style="margin-bottom:0;">
              ${all.src === "army"
                ? "该校为<b>军队院校</b>，不列入教育部《全国高等学校名单》（该名单仅收录普通高校与成人高校），但确属 985 / 211 / 双一流 序列，故单独补录展示。"
                : "以上照录教育部《全国高等学校名单》（截至 2026年6月17日）。标识码前 5 位为省级行政区与办学类型代码，后 5 位为校内序号。"}
            </p>
          </div>` : ""}

          ${hasElite ? `
          <div class="mt-16" style="padding:14px 16px;background:#fff9ef;border:1px solid #ffe3bf;border-radius:12px;">
            <b class="small">📌 择校视角点评</b>
            <p class="mt-8" style="color:var(--ink-2);line-height:1.9;">${esc(col.note)}</p>
          </div>` : ""}

          ${col && (col.tags || []).length ? `
          <div class="mt-16">
            <b class="small">🏷️ 优势方向标签</b>
            <div class="mt-10 flex wrap gap-10">
              ${col.tags.map(t => `<span class="chip">${esc(t)}</span>`).join("")}
            </div>
          </div>` : ""}

          ${col && col.ref ? `
          <div class="mt-16">
            <b class="small">📈 参考分档（新高考 750 制 · 演示值）</b>
            <div class="mt-10">
              <span class="chip purple" style="font-size:13px;padding:6px 14px;">参考线 ≈ ${col.ref} 分</span>
              ${col.hot ? `<span class="chip" style="font-size:13px;padding:6px 14px;margin-left:8px;">热度 ${"🔥".repeat(Math.min(col.hot, 5))}</span>` : ""}
            </div>
          </div>` : ""}

          <div class="demo-note mt-16">
            ${hasElite
              ? "⚠️ 院校层次、优势方向与点评为<b>演示性整理</b>，不构成填报依据；<b>官方登记信息</b>一节照录教育部名单，可核验。"
              : "⚠️ 本页展示的是教育部名单中的<b>官方登记信息</b>（校名、标识码、主管部门、所在地、办学层次），可核验。"}
            具体招生专业、选科要求、招生章程请以下方官方入口为准。
          </div>
        </div>

        <!-- 官方信息入口 -->
        <div class="report-card" style="margin:0 0 18px;">
          <h3 style="margin:0 0 6px;font-size:17px;">🔗 官方信息查询入口</h3>
          <p class="muted small" style="line-height:1.8;margin-bottom:14px;">
            本站不转载也不臆造招生数据。要看这所学校最权威的信息，请走下面这些官方通道：
          </p>
          <div class="grid g2" style="gap:12px;">
            <a class="link-card" href="${chsiUrl(dName)}" target="_blank" rel="noopener noreferrer">
              <b>🎓 阳光高考 · 院校库</b>
              <span>教育部高校招生阳光工程指定平台，查该校招生章程、专业计划、特殊类型招生</span>
            </a>
            <a class="link-card" href="https://gaokao.chsi.com.cn/sch/search.do?searchType=1" target="_blank" rel="noopener noreferrer">
              <b>📋 学信网 · 招生章程</b>
              <span>教育部学信网统一检索各高校当年招生章程与录取规则</span>
            </a>
            <a class="link-card" href="${baiduUrl(dName)}" target="_blank" rel="noopener noreferrer">
              <b>🌐 搜索该校官网</b>
              <span>通过搜索引擎定位学校本科招生网（.edu.cn 域名才是官方）</span>
            </a>
            <a class="link-card" href="plan.html">
              <b>🧮 用这所学校模拟填报</b>
              <span>输入你的省份与分数，看看这所学校在你的填报方案里落在冲/稳/保哪一档</span>
            </a>
          </div>
        </div>

        <!-- 按专业类看方向 -->
        <div class="report-card" style="margin:0 0 18px;">
          <h3 style="margin:0 0 6px;font-size:17px;">📚 按学科门类看专业方向</h3>
          <p class="muted small" style="line-height:1.8;margin-bottom:14px;">
            先选门类，再看该门类下有哪些专业可读。点击可直接跳到专业百科查看课程、就业与选科要求。
          </p>
          <div id="catBtns" class="flex wrap gap-10"></div>
          <div id="catMajors" class="grid g3 mt-16"></div>
        </div>

        <!-- 同省院校 -->
        ${sameProv.length ? `
        <div class="report-card" style="margin:0;">
          <h3 style="margin:0 0 12px;font-size:17px;">🏙️ ${esc(dProv)} 的其他院校（共 ${sameProvTotal} 所${sameProvTotal > sameProv.length ? "，显示前 " + sameProv.length + " 所" : ""}）</h3>
          <div class="flex wrap gap-10">
            ${sameProv.map(c => `<a class="chip" href="college.html?name=${encodeURIComponent(c.name)}"
                style="border:1px solid var(--line);background:#fff;padding:7px 13px;">${esc(c.name)}<span class="muted"> · ${esc(c.cat || c.level)}</span></a>`).join("")}
          </div>
          <div class="mt-16">
            <a class="btn btn-ghost btn-sm" href="colleges.html?q=${encodeURIComponent("")}">在 ${esc(dProv)} 全部院校中筛选 →</a>
          </div>
        </div>` : ""}
      </div>

      <!-- 侧栏 -->
      <div class="side-panel">
        <div class="side-stat-card">
          <h4>📊 院校速览</h4>
          <div class="stat-mini"><span>所在省份</span><span class="v">${esc(dProv || "—")}</span></div>
          <div class="stat-mini"><span>所在城市</span><span class="v">${esc(dCity || "—")}</span></div>
          <div class="stat-mini"><span>办学层次</span><span class="v">${esc(dLen || "—")}</span></div>
          ${allTags.length ? `<div class="stat-mini"><span>层次标签</span><span class="v">${allTags.map(esc).join(" · ")}</span></div>` : ""}
          <div class="stat-mini"><span>办学性质</span><span class="v">${esc(dRemark || "公办")}</span></div>
          <div class="stat-mini"><span>主管部门</span><span class="v">${esc(dDept || "—")}</span></div>
          <div class="stat-mini"><span>本地高校(全省)</span><span class="v">${all ? ALL.filter(c => c.prov === dProv).length : C.filter(c => c.prov === dProv).length} 所</span></div>
        </div>

        ${prov ? `
        <div class="side-stat-card">
          <h4>🗺️ 该省高考情况</h4>
          <div class="stat-mini"><span>高考模式</span><span class="v">${esc(prov.gaokao || "—")}</span></div>
          <div class="stat-mini"><span>普通高校</span><span class="v">约 ${prov.univs} 所</span></div>
          <div class="stat-mini"><span>双一流</span><span class="v">${prov.doubleFirst} 所</span></div>
          <div class="mt-16"><a class="btn btn-ghost btn-sm" style="width:100%" href="province.html?p=${encodeURIComponent(prov.full || dProv)}">查看该省分数线 →</a></div>
        </div>` : ""}

        <div class="side-stat-card" style="background:linear-gradient(135deg,#1d2b64,#2456e6);color:#fff;border:none;">
          <h4 style="color:rgba(255,255,255,.75)">💡 择校提醒</h4>
          <p style="font-size:13px;line-height:1.9;color:rgba(255,255,255,.92)">
            院校层次只解决「门槛」，不解决「出路」。同一所学校里，王牌专业和边缘专业的
            就业差距可能比两所学校之间还大——先定专业方向，再挑学校。
          </p>
        </div>
      </div>
    </div>`;

  /* 学科门类 -> 专业浏览 */
  const CATS = window.MAJOR_CATS || {};
  const catNames = Object.keys(CATS);
  const btnBox = document.getElementById("catBtns");
  const grid = document.getElementById("catMajors");

  function showCat(cat) {
    btnBox.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.cat === cat));
    const list = (CATS[cat] || []).slice(0, 12);
    grid.innerHTML = list.map(m => `
      <a class="major-card" href="majors.html?q=${encodeURIComponent(m.name)}" style="text-decoration:none;">
        <div class="top">
          <div>
            <h3>${esc(m.name)}</h3>
            <div class="cat">${esc(m.code)} · ${esc(m.sub || "—")}</div>
          </div>
        </div>
        <div class="major-meta">
          <span>学制 <b>${m.years} 年</b></span>
          <span>选科 <b>${esc(m.req || "不限")}</b></span>
        </div>
      </a>`).join("") +
      `<div class="muted small" style="grid-column:1/-1">
         以上为该门类前 12 个专业。完整目录请到 <a href="majors.html" style="color:var(--brand)">专业百科</a> 查看。
       </div>`;
  }

  if (!catNames.length) {
    document.getElementById("catBtns").innerHTML = '<span class="muted small">专业门类数据加载中…</span>';
  } else {
    const prefer = ["工学", "医学", "经济学", "管理学", "理学", "文学", "法学"];
    const ordered = prefer.filter(c => catNames.includes(c)).concat(catNames.filter(c => !prefer.includes(c)));
    btnBox.innerHTML = ordered.map(c =>
      `<button type="button" class="ft" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
    btnBox.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => showCat(b.dataset.cat)));
    showCat(ordered[0]);
  }
})();
</script>
</body>
</html>
