<body>
<div id="siteHeader"></div>

<section class="page-hero">
  <div class="container">
    <div class="crumb"><a href="index.html">首页</a> / <span>全国高校名单</span></div>
    <h1>🏛️ 全国高校名单</h1>
    <p>
      完整收录教育部《全国高等学校名单》（截至 <b>2026年6月17日</b>）——
      共 <b>2952 所</b>普通高等学校：本科 <b id="cntBen">1412</b> 所，高职专科 <b id="cntZhuan">1540</b> 所。
      支持按 <b>校名</b>、<b>学校标识码</b>、<b>省份</b>、<b>办学层次</b> 查询。
      <span class="muted">数据来源：<a href="https://hudong.moe.gov.cn/qggxmd/" target="_blank" rel="noopener noreferrer">教育部全国高等学校名单</a></span>
    </p>
  </div>
</section>

<section class="container">
  <div class="filter-bar" id="filterBar" style="margin-top:26px;">
    <div class="search-row">
      <div class="search-box" id="searchBox">
        <span class="si">🔍</span>
        <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off"
               placeholder="搜索校名或学校标识码，如：中国人民大学、4132010290…">
        <button type="button" class="search-clear" id="searchClear" title="清空" aria-label="清空">✕</button>
      </div>
      <button class="btn btn-brand" id="searchBtn">搜索</button>
    </div>

    <div class="filter-tags" id="levelTags"></div>
    <div class="filter-tags" id="provTags" style="max-height:132px;overflow-y:auto;"></div>

    <div class="flex between items-center wrap gap-10" style="margin-top:12px;">
      <span class="muted small" id="sumLine">—</span>
      <button class="btn btn-ghost btn-sm" id="resetBtn">↺ 重置筛选</button>
    </div>
  </div>

  <div class="search-collapsed" id="searchCollapsed" style="display:none;">
    <span class="q">🔍 搜索「<b id="scQ"></b>」，共 <b id="scN">0</b> 个结果</span>
    <button type="button" id="scEdit">修改关键词</button>
  </div>

  <div id="colGrid" class="grid g3"></div>

  <div class="flex items-center gap-10 mt-24" id="moreBox" style="display:none; justify-content:center;">
    <button class="btn btn-ghost" id="moreBtn">⬇️ 加载更多（<span class="cnt"></span>）</button>
  </div>

  <div id="emptyBox" class="empty-state" style="display:none">
    <div class="big">🔎</div>
    <p>没有找到匹配的院校，换个关键词或放宽筛选试试？</p>
    <button class="btn btn-ghost mt-16" id="emptyEdit">✏️ 修改关键词</button>
  </div>

  <div class="demo-note mt-24">
    ℹ️ 本名单为<b>教育部官方公布的完整院校名录</b>（校名、标识码、主管部门、所在地、办学层次均照录官方），
    用于"这所学校是否为正规高校"的核验。<b>不含</b>各校招生专业、选科要求、录取分数——
    那部分请点击院校进入详情页，走官方查询入口。
  </div>
</section>

<div id="siteFooter"></div>

<script src="assets/js/data-provinces.js"></script>
<script src="assets/js/data-colleges.js"></script>
<script src="assets/js/data-colleges-all.js"></script>
<script src="assets/js/data-majors.js"></script>
<script src="assets/js/data-majors-catalog.js"></script>
<script src="assets/js/data-majors-merge.js"></script>
<script src="assets/vendor/echarts.min.js"></script>
<script src="assets/json/china.js"></script>
<script src="assets/js/kb.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/assistant.js"></script>
<script>
buildShell("college");

(function () {
  const ALL = window.COLLEGES_ALL || [];
  const PAGE_STEP = 24;

  const input    = document.getElementById("searchInput");
  const searchBox= document.getElementById("searchBox");
  const clearBtn = document.getElementById("searchClear");
  const bar      = document.getElementById("filterBar");
  const collapsed= document.getElementById("searchCollapsed");
  const scQ      = document.getElementById("scQ");
  const scN      = document.getElementById("scN");
  const grid     = document.getElementById("colGrid");
  const moreBox  = document.getElementById("moreBox");
  const moreBtn  = document.getElementById("moreBtn");
  const emptyBox = document.getElementById("emptyBox");
  const sumLine  = document.getElementById("sumLine");
  const levelTags= document.getElementById("levelTags");
  const provTags = document.getElementById("provTags");

  const state = { q: "", level: "全部", prov: "全部", limit: PAGE_STEP };
  let __lastCount = 0;

  /* ---------- 顶部计数 ---------- */
  const ben = ALL.filter(c => c.level === "本科").length;
  const zhuan = ALL.length - ben;
  document.getElementById("cntBen").textContent = ben;
  document.getElementById("cntZhuan").textContent = zhuan;

  /* ---------- 层次标签 ---------- */
  const LEVELS = [
    { k: "全部",   t: "全部" },
    { k: "985",    t: "985（" + ALL.filter(c => c.tier === "985").length + "）" },
    { k: "211",    t: "211（" + ALL.filter(c => c.tier === "211").length + "）" },
    { k: "双一流", t: "双一流（" + ALL.filter(c => c.tier === "双一流").length + "）" },
    { k: "普通本", t: "普通本科（" + ALL.filter(c => c.tier === "普通本").length + "）" },
    { k: "专科",   t: "高职专科（" + ALL.filter(c => c.tier === "专科").length + "）" },
  ];
  levelTags.innerHTML = LEVELS.map(l =>
    `<button type="button" class="ft${l.k === "全部" ? " on" : ""}" data-level="${esc(l.k)}">${esc(l.t)}</button>`
  ).join("");
  levelTags.querySelectorAll(".ft").forEach(b => b.addEventListener("click", () => {
    state.level = b.dataset.level;
    levelTags.querySelectorAll(".ft").forEach(x => x.classList.toggle("on", x === b));
    state.limit = PAGE_STEP;
    render();
  }));

  /* ---------- 省份标签（按院校数降序） ---------- */
  const byProv = window.COLLEGE_BY_PROV || {};
  const provList = Object.keys(byProv)
    .sort((a, b) => byProv[b].length - byProv[a].length);
  provTags.innerHTML =
    `<button type="button" class="ft on" data-prov="全部">全部省份</button>` +
    provList.map(p => `<button type="button" class="ft" data-prov="${esc(p)}">${esc(p)}（${byProv[p].length}）</button>`).join("");
  provTags.querySelectorAll(".ft").forEach(b => b.addEventListener("click", () => {
    state.prov = b.dataset.prov;
    provTags.querySelectorAll(".ft").forEach(x => x.classList.toggle("on", x === b));
    state.limit = PAGE_STEP;
    render();
  }));

  /* ---------- 筛选 ---------- */
  function filtered() {
    const q = state.q.trim().toLowerCase();
    return ALL.filter(c => {
      if (state.level !== "全部" && c.tier !== state.level) return false;
      if (state.prov !== "全部" && c.prov !== state.prov) return false;
      if (q) {
        const hay = (c.name + " " + c.code + " " + c.city + " " + c.dept).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  /* ---------- 卡片 ---------- */
  const TIER_CLS = { "985": "purple", "211": "gold", "双一流": "green", "普通本": "gray", "专科": "gray" };

  function card(c) {
    const tierCls = TIER_CLS[c.tier] || "gray";
    const flag = c.remark ? `<span class="chip" style="font-size:11px;padding:2px 8px;">${esc(c.remark)}</span>` : "";
    return `
      <a class="major-card" href="college.html?name=${encodeURIComponent(c.name)}" style="text-decoration:none;">
        <div class="top">
          <div>
            <h3>${esc(c.name)}</h3>
            <div class="cat">${esc(c.city)} · ${esc(c.dept)}</div>
          </div>
        </div>
        <div class="major-meta">
          <span>标识码 <b style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;">${esc(c.code)}</b></span>
        </div>
        <div class="flex wrap gap-6" style="margin-top:10px;">
          <span class="chip ${tierCls}" style="font-size:11px;padding:2px 9px;">${esc(c.tier)}</span>
          <span class="chip" style="font-size:11px;padding:2px 9px;">${esc(c.level)}</span>
          ${flag}
        </div>
      </a>`;
  }

  /* ---------- 渲染 ---------- */
  function render() {
    const list = filtered();
    const show = list.slice(0, state.limit);
    __lastCount = list.length;

    grid.innerHTML = show.map(card).join("");
    sumLine.innerHTML = `共 <b>${list.length}</b> 所院校` +
      (state.level !== "全部" ? ` ｜ 层次：<b>${esc(state.level)}</b>` : "") +
      (state.prov !== "全部" ? ` ｜ 省份：<b>${esc(state.prov)}</b>` : "") +
      (state.q ? ` ｜ 关键词：<b>${esc(state.q)}</b>` : "");

    const more = list.length - show.length;
    moreBox.style.display = more > 0 ? "" : "none";
    if (more > 0) moreBtn.querySelector(".cnt").textContent = "还有 " + more + " 所";
    emptyBox.style.display = list.length ? "none" : "";
  }

  /* ---------- 搜索：受控 + 收起 ---------- */
  function collapseSearch(q, n) {
    scQ.textContent = q; scN.textContent = n;
    collapsed.style.display = ""; bar.style.display = "none";
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function expandSearch() {
    collapsed.style.display = "none"; bar.style.display = "";
    const y = bar.getBoundingClientRect().top + window.pageYOffset - 76;
    window.scrollTo({ top: y < 0 ? 0 : y, behavior: "smooth" });
    setTimeout(() => input.focus(), 220);
  }
  function doSearch() {
    const q = input.value.trim();
    state.q = q; state.limit = PAGE_STEP; render();
    if (q) collapseSearch(q, __lastCount); else expandSearch();
  }

  document.getElementById("searchBtn").addEventListener("click", doSearch);
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doSearch(); } });
  input.addEventListener("input", () => searchBox.classList.toggle("has-val", !!input.value));
  clearBtn.addEventListener("click", () => {
    input.value = ""; searchBox.classList.remove("has-val"); input.focus();
  });
  document.getElementById("scEdit").addEventListener("click", expandSearch);
  document.getElementById("emptyEdit").addEventListener("click", expandSearch);
  moreBtn.addEventListener("click", () => { state.limit += PAGE_STEP; render(); });

  document.getElementById("resetBtn").addEventListener("click", () => {
    state.q = ""; state.level = "全部"; state.prov = "全部"; state.limit = PAGE_STEP;
    input.value = ""; searchBox.classList.remove("has-val");
    levelTags.querySelectorAll(".ft").forEach(x => x.classList.toggle("on", x.dataset.level === "全部"));
    provTags.querySelectorAll(".ft").forEach(x => x.classList.toggle("on", x.dataset.prov === "全部"));
    collapsed.style.display = "none"; bar.style.display = "";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* 支持从首页带 ?q= 跳进来 */
  const initQ = decodeURIComponent(window.qs("q") || "");
  if (initQ) {
    input.value = initQ; searchBox.classList.add("has-val");
    state.q = initQ;
  }
  render();
  if (initQ) collapseSearch(initQ, __lastCount);

  /* 搜索框只在首屏吸附，避免手机端全程遮挡 */
  if ("IntersectionObserver" in window) {
    const sentinel = document.createElement("div");
    sentinel.style.cssText = "height:1px;margin-top:-1px;";
    bar.parentNode.insertBefore(sentinel, bar);
    new IntersectionObserver(([e]) => bar.classList.toggle("stuck", e.intersectionRatio > 0), { threshold: [0] })
      .observe(sentinel);
  }
})();
</script>
</body>
